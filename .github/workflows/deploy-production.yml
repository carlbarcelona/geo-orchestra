# Deploys master to Vercel production on every push, after the same checks
# contributors run locally. Requires the repository secret VERCEL_TOKEN.
name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  # Not secrets: the same IDs are in .vercel/project.json on linked machines.
  VERCEL_ORG_ID: team_saEcOhYmqQve4qcA0c8SCyMd
  VERCEL_PROJECT_ID: prj_yfwrDUdqRF4XIyd2EFz2JspAblQw

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
